apiVersion: apps/v1
kind: Deployment
metadata:
  name: helixqa-celery-worker
  namespace: helixqa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helixqa-celery-worker
  template:
    metadata:
      labels:
        app: helixqa-celery-worker
    spec:
      serviceAccountName: helixqa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: celery-worker
        image: helixqa-api:v1.0.0
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: redis-url
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: celery-broker-url
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: celery-result-backend
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: secret-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: anthropic-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: openai-api-key
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: gemini-api-key
        - name: AI_DEFAULT_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: helixqa-config
              key: ai-default-provider
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        command:
          - celery
          - -A
          - app.tasks.celery_app
          - worker
          - --loglevel=info
          - --concurrency=2
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
      volumes:
      - name: tmp
        emptyDir: {}
