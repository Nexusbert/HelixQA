apiVersion: apps/v1
kind: Deployment
metadata:
  name: helixqa-api
  namespace: helixqa
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: helixqa-api
  template:
    metadata:
      labels:
        app: helixqa-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: helixqa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: docker.io/neuralnexu/helixqa-api:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: redis-url
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: celery-broker-url
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: celery-result-backend
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: secret-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: anthropic-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: openai-api-key
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: gemini-api-key
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: github-client-id
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: github-client-secret
        - name: GITHUB_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: github-webhook-secret
        - name: SEMGREP_APP_TOKEN
          valueFrom:
            secretKeyRef:
              name: helixqa-secrets
              key: semgrep-app-token
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: helixqa-config
              key: environment
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: helixqa-config
              key: debug
        - name: ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: helixqa-config
              key: allowed-origins
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: helixqa-config
              key: app-name
        - name: AI_DEFAULT_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: helixqa-config
              key: ai-default-provider
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          valueFrom:
            configMapKeyRef:
              name: helixqa-config
              key: access-token-expire-minutes
        - name: REFRESH_TOKEN_EXPIRE_DAYS
          valueFrom:
            configMapKeyRef:
              name: helixqa-config
              key: refresh-token-expire-days
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
