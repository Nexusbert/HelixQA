apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helixqa-ingress
  namespace: helixqa
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: helixqa-api-service
            port:
              number: 8000
